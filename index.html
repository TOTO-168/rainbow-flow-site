<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GRAND MODERN CHINA // 虹光流序・電子微塵</title>
  <meta name="version" content="1.2.7">
  <meta name="offline-assets" content="true">
  <link rel="stylesheet" href="style.css">
</head>
<body data-theme="paper">

  <!-- WebGL 畫布 -->
  <canvas id="gl-canvas"></canvas>


  <!-- 互動控制與面板層 (Interactive Controls Layer) -->
  <!-- 採用高清晰深色玻璃擬態，確保按鈕在任何背景下均清晰可讀 -->
  <div class="controls-layer">

    <!-- 底部控制欄 (Bottom Interactive Dock) -->
    <footer class="bottom-dock">
      
      <!-- 藝術風格切換 -->
      <div class="preset-switcher">
        <div class="preset-pill-indicator"></div>
        <button class="preset-btn active" data-preset="0" type="button" aria-pressed="true">珠光</button>
        <button class="preset-btn" data-preset="1" type="button" aria-pressed="false">微塵</button>
        <button class="preset-btn" data-preset="2" type="button" aria-pressed="false">流雲</button>
        <button class="preset-btn" data-preset="3" type="button" aria-pressed="false">浮光</button>
        <button class="preset-btn" data-preset="4" type="button" aria-pressed="false">琉璃</button>
      </div>

      <!-- 操作按鈕 -->
      <div class="dock-actions-container" id="dock-actions-container">
        <div class="dock-actions">
          <button id="hide-buttons-btn" class="action-btn" type="button" aria-label="隱藏按鈕" aria-pressed="false" title="隱藏按鈕">
            <svg class="icon-eye" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg class="icon-eye-off" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>

          <button id="hide-all-btn" class="action-btn" type="button" aria-label="全螢幕模式" aria-pressed="false" title="全螢幕模式">
            <svg class="icon-maximize" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 3 21 3 21 9"></polyline>
              <polyline points="9 21 3 21 3 15"></polyline>
              <line x1="21" y1="3" x2="14" y2="10"></line>
              <line x1="3" y1="21" x2="10" y2="14"></line>
            </svg>
            <svg class="icon-minimize" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="4 14 10 14 10 20"></polyline>
              <polyline points="20 10 14 10 14 4"></polyline>
              <line x1="14" y1="10" x2="21" y2="3"></line>
              <line x1="10" y1="14" x2="3" y2="21"></line>
            </svg>
          </button>

          <button id="pause-btn" class="action-btn" type="button" aria-label="暫停畫面" aria-pressed="false" title="暫停畫面">
            <svg class="icon-pause" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="6" y="4" width="4" height="16"></rect>
              <rect x="14" y="4" width="4" height="16"></rect>
            </svg>
            <svg class="icon-play" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
          </button>

          <button id="capture-btn" class="action-btn" type="button" aria-label="典藏海報" title="典藏海報">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
              <circle cx="12" cy="13" r="4"></circle>
            </svg>
          </button>

          <div class="panel-anchor-wrapper">
            <button id="toggle-panel-btn" class="action-btn" type="button" aria-label="設定" title="設定" aria-expanded="false" aria-controls="controls-panel">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="4" y1="6" x2="20" y2="6"></line>
                <line x1="4" y1="12" x2="20" y2="12"></line>
                <line x1="4" y1="18" x2="20" y2="18"></line>
              </svg>
            </button>

            <!-- 參數微調抽屜面板 (Controls Drawer - 展開於按鈕正上方) -->
            <div id="controls-panel" class="controls-panel" role="dialog" aria-modal="false" aria-labelledby="controls-panel-title" aria-hidden="true" inert>
              <div class="panel-header">
                <h2 id="controls-panel-title" class="panel-title">設定</h2>
              </div>

              <div class="slider-group">
                <section class="settings-section" aria-labelledby="effects-section-title">
                  <h3 id="effects-section-title" class="settings-section-title">效果調整</h3>
                  <div class="settings-section-controls">
                    <div class="slider-item">
                      <div class="slider-label-row">
                        <label for="slider-speed">流動節奏</label>
                        <span id="val-speed" class="slider-val">0.6</span>
                      </div>
                      <input type="range" id="slider-speed" class="custom-range" min="0.1" max="2.5" step="0.1" value="0.6">
                    </div>

                    <div class="slider-item">
                      <div class="slider-label-row">
                        <label for="slider-dispersion">光學色散</label>
                        <span id="val-dispersion" class="slider-val">1.2</span>
                      </div>
                      <input type="range" id="slider-dispersion" class="custom-range" min="0.0" max="3.0" step="0.1" value="1.2">
                    </div>

                    <div class="slider-item">
                      <div class="slider-label-row">
                        <label for="slider-grain">微塵質地</label>
                        <span id="val-grain" class="slider-val">0.6</span>
                      </div>
                      <input type="range" id="slider-grain" class="custom-range" min="0.1" max="2.5" step="0.1" value="0.6">
                    </div>

                    <div class="slider-item">
                      <div class="slider-label-row">
                        <label for="slider-cursor">游標影響力</label>
                        <span id="val-cursor" class="slider-val">0.2</span>
                      </div>
                      <input type="range" id="slider-cursor" class="custom-range" min="0.0" max="5.0" step="0.1" value="0.2">
                    </div>
                  </div>
                </section>

                <section class="settings-section" aria-labelledby="background-section-title">
                  <h3 id="background-section-title" class="settings-section-title">背景意境</h3>
                  <div class="slider-item">
                    <div id="background-mode-label" class="sr-only">背景意境</div>
                    <div class="bg-mode-selector" role="group" aria-labelledby="background-mode-label">
                      <div class="bg-pill-indicator"></div>
                      <button class="bg-btn" data-mode="0" type="button" aria-pressed="false">水墨</button>
                      <button class="bg-btn" data-mode="1" type="button" aria-pressed="false">玄黑</button>
                      <button class="bg-btn" data-mode="2" type="button" aria-pressed="false">紙白</button>
                      <button class="bg-btn active" data-mode="3" type="button" aria-pressed="true">黛藍</button>
                      <button class="bg-btn" data-mode="4" type="button" aria-pressed="false">赤霞</button>
                    </div>
                  </div>
                </section>

                <section class="settings-section" aria-labelledby="palette-section-title">
                  <h3 id="palette-section-title" class="settings-section-title">色彩</h3>
                  <div class="palette-editor">
                    <div class="slider-label-row">
                      <span>自訂色盤</span>
                      <span id="palette-status" class="slider-val"></span>
                    </div>
                    <div class="palette-editor-row">
                      <div class="palette-colors">
                        <label class="palette-color-wrap" title="色盤色彩一">
                          <input class="palette-color" type="color" value="#ff5a82" aria-label="色盤色彩一">
                        </label>
                        <label class="palette-color-wrap" title="色盤色彩二">
                          <input class="palette-color" type="color" value="#28c3ff" aria-label="色盤色彩二">
                        </label>
                        <label class="palette-color-wrap" title="色盤色彩三">
                          <input class="palette-color" type="color" value="#a04bff" aria-label="色盤色彩三">
                        </label>
                      </div>
                      <div class="palette-actions">
                        <button id="apply-palette-btn" class="panel-tool-btn" type="button">套用</button>
                        <button id="reset-palette-btn" class="panel-tool-btn" type="button">恢復</button>
                      </div>
                    </div>
                  </div>
                </section>

                <section class="settings-section" aria-labelledby="palette-slots-section-title">
                  <h3 id="palette-slots-section-title" class="settings-section-title">色組記憶</h3>
                  <div class="palette-slots-editor">
                    <div class="palette-slot-grid">
                      <button class="palette-slot" data-slot="0" type="button" aria-pressed="true">
                        <span class="palette-slot-name">色組一</span>
                        <span class="palette-slot-status">空白</span>
                      </button>
                      <button class="palette-slot" data-slot="1" type="button" aria-pressed="false">
                        <span class="palette-slot-name">色組二</span>
                        <span class="palette-slot-status">空白</span>
                      </button>
                      <button class="palette-slot" data-slot="2" type="button" aria-pressed="false">
                        <span class="palette-slot-name">色組三</span>
                        <span class="palette-slot-status">空白</span>
                      </button>
                    </div>
                    <button id="save-palette-slot-btn" class="panel-tool-btn" type="button">儲存至色組1</button>
                  </div>
                </section>

              </div>
            </div>
          </div>
        </div>
      </div>

    </footer>

  </div>

  <!-- 主腳本 -->
  <script src="app.js"></script>
</body>
</html>
